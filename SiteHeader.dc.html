<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
</helmet>
<header style="background:#FFFFFF;border-bottom:1px solid #E6E1D8;font-family:'Public Sans',system-ui,sans-serif;color:#14263D;position:relative;z-index:20">
  <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
    <div style="background:#14263D;color:#DCE3EA;font-size:15px">
      <div style="max-width:1280px;margin:0 auto;padding:10px 40px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:8px"><span style="width:16px;height:16px;background:#8FD9CB;mask:url(https://unpkg.com/lucide-static@0.454.0/icons/map-pin.svg) center/contain no-repeat;-webkit-mask:url(https://unpkg.com/lucide-static@0.454.0/icons/map-pin.svg) center/contain no-repeat"></span>2825 Lewis Speedway #101, St. Augustine, FL 32084</div>
        <div style="display:flex;align-items:center;gap:8px"><span style="width:16px;height:16px;background:#8FD9CB;mask:url(https://unpkg.com/lucide-static@0.454.0/icons/clock.svg) center/contain no-repeat;-webkit-mask:url(https://unpkg.com/lucide-static@0.454.0/icons/clock.svg) center/contain no-repeat"></span>Mon 10–5 · Tue–Thu 8:30–5 · Fri 8–12 · Closed weekends</div>
      </div>
    </div>
  </sc-if>
  <div style="max-width:1280px;margin:0 auto;padding:16px clamp(16px,3cqi,40px);display:flex;align-items:center;justify-content:space-between;gap:24px">
    <a href="Homepage.dc.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:#14263D;min-width:0">
      <span style="flex:none;width:46px;height:46px;border-radius:12px;background:#14263D;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:26px">M</span>
      <span style="display:flex;flex-direction:column;line-height:1.15;min-width:0">
        <span style="font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:23px">Matanzas</span>
        <span style="font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#4F5F70">Chiropractic &amp; Spine Injury Center</span>
      </span>
    </a>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:28px">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
          <a href="{{ l.href }}" style="color:#14263D;text-decoration:none;font-size:16px;font-weight:600;padding:8px 0;border-bottom:2px solid {{ l.bc }}">{{ l.label }}</a>
        </sc-for>
      </nav>
      <a href="tel:+19046791963" style="display:flex;align-items:center;gap:10px;height:56px;padding:0 26px;border-radius:999px;background:#0F766E;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:18px;white-space:nowrap;box-shadow:0 1px 2px rgba(20,38,61,.08),0 8px 20px rgba(15,118,110,.22)" style-hover="background:#0B5F58">
        <span style="width:20px;height:20px;background:#FFFFFF;mask:url(https://unpkg.com/lucide-static@0.454.0/icons/phone.svg) center/contain no-repeat;-webkit-mask:url(https://unpkg.com/lucide-static@0.454.0/icons/phone.svg) center/contain no-repeat"></span>
        Call (904) 679-1963
      </a>
    </sc-if>
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;gap:10px;flex:none">
        <a href="tel:+19046791963" aria-label="Call (904) 679-1963" style="width:52px;height:52px;border-radius:999px;background:#0F766E;display:flex;align-items:center;justify-content:center">
          <span style="width:22px;height:22px;background:#FFFFFF;mask:url(https://unpkg.com/lucide-static@0.454.0/icons/phone.svg) center/contain no-repeat;-webkit-mask:url(https://unpkg.com/lucide-static@0.454.0/icons/phone.svg) center/contain no-repeat"></span>
        </a>
        <button onClick="{{ toggle }}" aria-label="Menu" style="width:52px;height:52px;border-radius:999px;background:#FFFFFF;border:1.5px solid #D9D3C7;display:flex;align-items:center;justify-content:center;cursor:pointer">
          <span style="width:22px;height:22px;background:#14263D;mask:url(https://unpkg.com/lucide-static@0.454.0/icons/menu.svg) center/contain no-repeat;-webkit-mask:url(https://unpkg.com/lucide-static@0.454.0/icons/menu.svg) center/contain no-repeat"></span>
        </button>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav style="border-top:1px solid #E6E1D8;padding:8px 16px 20px;display:flex;flex-direction:column">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
        <a href="{{ l.href }}" style="display:flex;align-items:center;min-height:56px;font-size:19px;font-weight:600;color:#14263D;text-decoration:none;border-bottom:1px solid #EFEBE3">{{ l.label }}</a>
      </sc-for>
      <p style="margin:16px 0 0;font-size:16px;color:#4F5F70;line-height:1.5">2825 Lewis Speedway #101, St. Augustine<br>Mon 10–5 · Tue–Thu 8:30–5 · Fri 8–12</p>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;shockwave&quot;,&quot;auto&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false };
  renderVals() {
    const mobile = !!this.props.mobile;
    const active = this.props.active || 'home';
    const links = [
      { id: 'shockwave', label: 'Shockwave Therapy', href: 'ShockwavePage.dc.html' },
      { id: 'auto', label: 'Auto Injury', href: 'AutoAccidentPage.dc.html' },
      { id: 'va', label: 'VA Community Care', href: 'Homepage.dc.html#va' },
      { id: 'about', label: 'About', href: 'Homepage.dc.html#about' },
      { id: 'location', label: 'Location', href: 'Homepage.dc.html#location' },
    ].map(l => ({ ...l, bc: l.id === active ? '#0F766E' : 'transparent' }));
    return {
      desktop: !mobile, mobile, links,
      menuOpen: mobile && this.state.open,
      toggle: () => this.setState(s => ({ open: !s.open })),
    };
  }
}
</script>
</body>
</html>
